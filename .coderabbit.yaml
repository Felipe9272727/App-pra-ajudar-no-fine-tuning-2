# =============================================================================
# .coderabbit.yaml — QWEN Mission Control
# CodeRabbit AI Review Configuration
# =============================================================================

language: "pt-BR"

reviews:
  # ── Revisão geral ──────────────────────────────────────────────────────────
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  poem: false

  # ── Perfil de revisão ─────────────────────────────────────────────────────
  profile: "assertive"
  path_instructions:
    - path: "**/*.html"
      instructions: |
        Este arquivo é um **single-file HTML app** (QWEN Mission Control) que contém
        HTML + CSS + JavaScript inline. Trate TUDO dentro de <script> como código
        JavaScript de produção. Revise com o mesmo rigor de um .js separado.

        ## Contexto do projeto
        - Painel mobile para monitorar treinamento de LLM (Qwen2.5-Coder-7B) no Google Colab
        - Conecta via Cloudflare Tunnel bridge
        - Usa Groq API (groq.com) para inferência de IA — NÃO é Grok (xAI)
        - Integra Tavily (busca semântica) e Wikipedia API como fallback
        - Modos de IA: Deep Think (3 passes), Deep Research (sub-queries), Agent ReAct (loop)
        - Roteamento inteligente de modelos Groq (QwQ-32B, DeepSeek-R1, Llama-3.3-70B, etc.)

        ## Problemas conhecidos — PRIORIZE revisar e sugerir correções para:

        ### 🔴 P1 — Scan de modelos travado/lento
        - O scan usa /models da Groq mas às vezes cai em fallback de pings paralelos
        - Verificar: timeout handling, race conditions, Promise.allSettled vs Promise.all
        - Sugerir: abort controller, cache de resultados, debounce na reconexão

        ### 🔴 P2 — Feedback visual insuficiente durante scan
        - O header muda label mas não mostra progresso granular
        - Verificar: se existe UI de progresso (X de Y modelos, qual encontrado)
        - Sugerir: barra de progresso ou lista ao vivo com status por modelo

        ### 🟡 P3 — Chave API não persiste ao trocar arquivo
        - localStorage pode falhar quando o path/nome do arquivo muda (origem diferente)
        - Verificar: lógica de leitura do localStorage no init, fallback para sessionStorage
        - Sugerir: ler de ambos (localStorage → sessionStorage → prompt), normalizar a chave de storage

        ### 🟡 P4 — Roteamento de modelo inconsistente
        - Às vezes seleciona modelo fraco (8B) quando há modelo forte disponível (70B, QwQ)
        - Verificar: lógica de seleção/ranking de modelos, se a lista de disponíveis está atualizada
        - Sugerir: ranking explícito por capability tier, validação antes da primeira mensagem

        ## Regras de revisão específicas
        - **Segurança**: chaves de API NUNCA devem aparecer hardcoded ou em logs do console
        - **Performance mobile**: verificar listeners sem cleanup, memory leaks em intervals/timeouts
        - **Error handling**: todo fetch/await deve ter try-catch com fallback gracioso
        - **UX**: estados de loading, empty states e erros devem ser visíveis ao usuário
        - **Acessibilidade**: verificar contraste, touch targets mínimos de 44px, labels em inputs

    - path: "**/*.py"
      instructions: |
        Código Python do lado do Colab (bridge/pipeline). Verificar:
        - Segurança do tunnel (autenticação, sanitização de input)
        - Gerenciamento de VRAM (torch.cuda.empty_cache, gradient checkpointing)
        - Logging estruturado para as métricas que o painel consome

    - path: "**/*.{json,yaml,yml}"
      instructions: |
        Arquivos de configuração. Verificar:
        - Não conter chaves/tokens hardcoded
        - Schemas válidos
        - Valores de timeout e retry razoáveis

  # ── Ferramentas de análise ─────────────────────────────────────────────────
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    languagetool:
      enabled: true
      enabled_rules:
        - "PT_BR"
    biome:
      enabled: true
    htmlhint:
      enabled: true
    eslint:
      enabled: true

chat:
  auto_reply: true

# ── Filtros de arquivo ───────────────────────────────────────────────────────
path_filters:
  - "!**/*.min.js"
  - "!**/*.min.css"
  - "!**/node_modules/**"
  - "!**/.git/**"
  - "!**/dist/**"

# ── Configuração de early access ─────────────────────────────────────────────
early_access: true
